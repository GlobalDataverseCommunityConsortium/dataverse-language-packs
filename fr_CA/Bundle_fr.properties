harvestserver.noSets.why.reason1=Le moissonnage consiste ‡ Èchanger des mÈtadonnÈes avec d'autres dÈpÙts. En tant que <b><i>serveur</i></b> de moissonnage, votre dataverse peut rendre disponible certains ensembles de donnÈes locaux ‡ des clients de moissonnage distants. Il peut s'agir d'autres instances de Dataverse, ou encore de clients compatibles avec le protocole de moissonnage OAI-PMH.
harvestserver.noSets.why.reason2=Seuls les ensembles de donnÈes publiÈs et non restreints de votre Dataverse peuvent Ítre moissonnÈs. Les clients distants maintiennent normalement leurs enregistrements synchronisÈs gr‚ce ‡ des mises ‡ jour incrÈmentielles programmÈes, quotidiennes ou hebdomadaires, rÈduisant ainsi la charge sur votre serveur. Notez que seules les mÈtadonnÈes sont moissonnÈes. Les moissonneurs distants ne tentent gÈnÈralement pas de tÈlÈcharger eux-mÍmes les fichiers de donnÈes.
harvestserver.noSets.how.header=Comment activer un serveur de moissonnage?
harvestserver.noSets.how.tip1=Le serveur de moissonnage peut Ítre activÈ ou dÈsactivÈ ‡ partir de cette page. 
harvestserver.noSets.how.tip2=Une fois le service activÈ, vous pouvez dÈfinir des collections d'ensembles de donnÈes locales qui seront disponibles pour les moissonneurs distants sous <i>Ensembles OAI</i>. Les ensembles sont dÈfinis par des requÍtes de recherche (par exemple, authorName:king; ou parentId:1234 \u2014 pour sÈlectionner tous les ensembles de donnÈes appartenant au dataverse spÈcifiÈ\u00A0; ou dsPersistentId:"doi:1234/" pour sÈlectionner tous les ensembles de donnÈes avec l'identifiant pÈrenne spÈcifiÈ). Consulter la section sur l'API de recherche du guide d'utilisation de Dataverse pour plus d'informations sur les requÍtes de recherche. 
