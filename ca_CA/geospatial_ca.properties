datasetfieldtype.geographicCoverage.description=Informació sobre la cobertura geogràfica de les dades. Inclou l'abast geogràfic total de les dades.
datasetfieldtype.country.description=País o nació on se centren les dades.
datasetfieldtype.state.description=Estat o província on se centren les dades. Utilitzeu GeoNames per a una ortografia correcta i eviteu abreviatures.
datasetfieldtype.city.description=El nom de la ciutat on se centren les dades. Utilitzeu GeoNames per a una ortografia correcta i eviteu abreviatures.
datasetfieldtype.otherGeographicCoverage.description=Altra informació sobre la cobertura geogràfica de les dades.
datasetfieldtype.geographicUnit.description=Nivell més baix d'agregació geogràfica on se centra el conjunt de dades, p. ex., poble, comtat, regió.
datasetfieldtype.geographicBoundingBox.description=La descripció geomètrica fonamental per a qualsevol conjunt de dades que modeli la geografia és el quadre geogràfic de delimitació. Descriu el quadre mínim, definit per longituds oest i est i latituds nord i sud, que inclou la major extensió geogràfica de la cobertura geogràfica del dataset. Aquest element s'utilitza en el primer pas d'una cerca basada en coordenades. Es recomana incloure aquest element al llibre de codis, però és obligatori si s'inclou la caixa de polígons lligats.
datasetfieldtype.westLongitude.description=Longitud més occidental que delimita l'extensió geogràfica del dataset. Un interval de valors vàlid, expressat en graus decimals, és -180,0 <= Valor de longitud límit oest <= 180,0
datasetfieldtype.eastLongitude.description=Longitud més oriental que delimita l'extensió geogràfica del dataset. Un interval de valors vàlid, expressat en graus decimals, és -180,0 <= Valor de longitud límit oest <= 180,0
datasetfieldtype.northLatitude.description=Coordenada més septentrional que delimita l'extensió geogràfica del dataset. Un interval de valors vàlid, expressat en graus decimals, és -90,0 <= valor de latitud límit nord <= 90,0
datasetfieldtype.southLatitude.description=Coordenada més meridional que delimita l'extensió geogràfica del dataset. Un interval de valors vàlid, expressat en graus decimals, és -90,0 <= valor de latitud límit nord <= 90,0
