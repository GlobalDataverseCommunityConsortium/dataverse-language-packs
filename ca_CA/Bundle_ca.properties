harvestserver.noSets.how.tip2=Un cop el servei estigui habilitat, podeu definir col·leccions de satasets locals que estaran disponibles per a collidors remots com a <i>Conjunts OAI</i>. Els conjunts es defineixen mitjançant consultes de cerca (per exemple, authorName: king; o parentId: 1234, per seleccionar tots els datasets que pertanyen al dataset especificat; o dsPersistentId: "doi: 1234 /" per seleccionar tots els datasets amb l'identificador persistent autoritzat especificat). Consulteu la secció API de cerca de la Guia de l'usuari de Dataverse per obtenir més informació sobre les consultes de cerca
