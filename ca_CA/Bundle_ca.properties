#harvestclients.xhtml
harvestclients.title=Gestionar Clients de Recol·lecció
harvestclients.toptip=Es pot programar que la recol·lecció s'executi en un moment concret o sota demanda. La recol·lecció es pot iniciar aquí o mitjançant l'API REST.
harvestclients.noClients.label=No hi ha clients configurats.
harvestclients.noClients.why.header=Que és la Recol·lecció?
harvestclients.noClients.why.reason1=La recol·lecció és un procés d'intercanvi de metadades amb altres repositoris. Com a <b><i>client</i></b> de recol·lecció, Dataverse recopila registres de metadades de fonts remotes. Aquestes poden ser altres instàncies de Dataverse o altres arxius que admetin OAI-PMH, el protocol estàndard de recol·lecció.
harvestclients.noClients.why.reason2=Els usuaris poden cercar els registres de metadades obtinguts. En fer clic a un dataset recol·lectat als resultats de la cerca, l'usuari es dirigirà al repositori original. Els datasets obtinguts no es poden editar a la instal·lació de Dataverse.
harvestclients.noClients.how.header=Com Utilitzar la Recol·lecció
harvestclients.noClients.how.tip1=Per recol·lectar metadades, es crea i es configura un <i>Client de Recol·lecció</i> per a cada repositori remot. Tingueu en compte que quan creeu un client, haureu de seleccionar un datavers local existent per allotjar datasets recol·lectats.
harvestclients.noClients.how.tip2=Els registres obtinguts es poden mantenir sincronitzats amb el dipòsit original mitjançant actualitzacions incrementals programades, per exemple, diàriament o setmanalment. Com a alternativa, les recol·lectes es poden executar sota demanda, des d'aquesta pàgina o mitjançant l'API REST.
harvestclients.noClients.getStarted=Per començar, feu clic al botó Afegir Client de més amunt. Per obtenir més informació sobre la recol·lecció, visiteu la secció <a href="{0}/{1}/user/index.html#index" title="Harvesting - Dataverse User Guide" target="_blank">Harvesting</a> de la Guia d'Usuari.
