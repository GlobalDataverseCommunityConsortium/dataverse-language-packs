datasetfieldtype.coverage.Spectral.MaximumWavelength.description=Максимальна довжина хвилі спектральної смуги пропускання в метрах.
datasetfieldtype.coverage.Temporal.description=Часовий період, охоплений даними.
datasetfieldtype.coverage.Temporal.StartTime.description=Початкова дата набору даних
datasetfieldtype.coverage.Temporal.StopTime.description=Кінцева дата набору даних
datasetfieldtype.coverage.Spatial.description=Покриття неба об'єкта даних.
datasetfieldtype.coverage.Depth.description=Типова глибина покриття або чутливість об'єкта даних у Янських.
datasetfieldtype.coverage.ObjectDensity.description=Типова щільність об'єктів, записів каталогу, наведень телескопа тощо на небі, у кількості на квадратний градус.
datasetfieldtype.coverage.ObjectCount.description=Загальна кількість об'єктів, записів каталогу тощо в об'єкті даних.
datasetfieldtype.coverage.SkyFraction.description=Частка неба, представлена в спостереженнях, від 0 до 1.
datasetfieldtype.coverage.Polarization.description=Покриття поляризації
datasetfieldtype.redshiftType.description=Тип червоного зміщення: "Redshift" або "Optical" чи "Radio" визначення доплерівської швидкості, використаної в об'єкті даних.
datasetfieldtype.resolution.Redshift.description=Роздільна здатність у червоному зміщенні (безрозмірна) або доплерівська швидкість (км/с) в об'єкті даних.
datasetfieldtype.coverage.RedshiftValue.description=Значення червоного зміщення (безрозмірне) або доплерівська швидкість (км/с) в об'єкті даних.
datasetfieldtype.coverage.Redshift.MinimumValue.description=Мінімальне значення червоного зміщення (безрозмірне) або доплерівська швидкість (км/с) в об'єкті даних.
datasetfieldtype.coverage.Redshift.MaximumValue.description=Максимальне значення червоного зміщення (безрозмірне) або доплерівська швидкість (км/с) в об'єкті даних.
