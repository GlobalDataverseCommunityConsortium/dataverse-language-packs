datasetfieldtype.sourceCHIA.description=Джерело - це опис джерела даних. Це Бюро статистики праці? Це дані ООН?
datasetfieldtype.datesAdditionalInformationCHIA.description=Дати - Додаткова Інформація - Зазначте будь-яку додаткову інформацію про дати або часові періоди в наборі даних, включаючи інтервали (щорічний, десятирічний, сторічний тощо). Також вкажіть стовпець (стовпці) у наборі даних, де можна знайти дати та іншу часову інформацію.
datasetfieldtype.variablesCHIA.description=Змінні - Визначте змінні в цьому наборі даних. Будь ласка, вкажіть стовпець у наборі даних, де можна знайти інформацію про змінні.
datasetfieldtype.classificationSchemaCHIA.description=Схема Класифікації - Якщо в цьому наборі даних є схема класифікації, опишіть її. Наприклад, M_20_24 слід читати як Чоловіки, віком 20-24.
datasetfieldtype.provenanceCHIA.description=Походження - Походження наборів даних є записом про право власності і буде використовуватися як керівництво до автентичності або якості даних. Наприклад, опис походження може бути таким: "Цей набір даних був створений з даних, зібраних Девідом Руволо під час поїздки для збору даних до Іспанії в 1992 році. З того часу дані не змінювалися, окрім міграції до більш сучасних форматів."
datasetfieldtype.rightsAvailabilityCHIA.description=Права/Доступність - Чи маєте ви права на розповсюдження цих даних?
