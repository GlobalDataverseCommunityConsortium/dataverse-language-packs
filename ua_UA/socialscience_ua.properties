datasetfieldtype.unitOfAnalysis.description=Базова одиниця аналізу або спостереження, яку описує цей набір даних, наприклад особи, сім'ї/домогосподарства, групи, інститути/організації, адміністративні одиниці тощо. Для інформації про контрольований словник DDI для цього елементу, будь ласка, зверніться до веб-сторінки DDI за адресою http://www.ddialliance.org/controlled-vocabularies.
datasetfieldtype.universe.description=Опис популяції, охопленої даними у файлі; група людей або інших елементів, які є об'єктом дослідження і до яких відносяться результати дослідження. Вік, національність і місце проживання зазвичай допомагають окреслити дану генеральну сукупність, але може використовуватися будь-яка кількість інших факторів, таких як вікові обмеження, стать, сімейний стан, раса, етнічна група, національність, дохід, статус ветерана, кримінальні судимості тощо. Генеральна сукупність може складатися з елементів інших, ніж особи, таких як житлові одиниці, судові справи, смерті, країни тощо. Загалом, з опису генеральної сукупності повинно бути можливо визначити, чи є дана особа або елемент членом досліджуваної популяції. Також відома як сукупність інтересу, популяція інтересу та цільова популяція.
datasetfieldtype.timeMethod.description=Часовий метод або часовий вимір збору даних, такий як панель, перехресний, трендовий, часовий ряд або інший.
datasetfieldtype.dataCollector.description=Особа, агенція або організація, відповідальна за проведення анкетування або інтерв'ю або складання даних.
datasetfieldtype.collectorTraining.description=Тип навчання, наданого збирачу даних
datasetfieldtype.frequencyOfDataCollection.description=Якщо зібрані дані включають більше ніж одну точку в часі, вкажіть частоту, з якою дані збиралися; тобто щомісячно, щоквартально або інше.
datasetfieldtype.samplingProcedure.description=Тип вибірки та дизайн вибірки, використаний для відбору респондентів опитування для представлення популяції. Може включати посилання на цільовий розмір вибірки та частку вибірки.
datasetfieldtype.targetSampleSize.description=Конкретна інформація щодо цільового розміру вибірки, фактичного розміру вибірки та формули, використаної для її визначення.
datasetfieldtype.targetSampleActualSize.description=Фактичний розмір вибірки.
datasetfieldtype.targetSampleSizeFormula.description=Формула, використана для визначення цільового розміру вибірки.
datasetfieldtype.deviationsFromSampleDesign.description=Покажіть відповідність, а також розбіжності між одиницями вибірки (отриманими) та доступною статистикою для популяції (вік, співвідношення статей, сімейний стан тощо) в цілому.
datasetfieldtype.collectionMode.description=Метод, використаний для збору даних; характеристики інструментарію (наприклад, телефонне інтерв'ю, поштова анкета або інше).
datasetfieldtype.researchInstrument.description=Тип інструменту збору даних, що використовується. Структурований вказує на інструмент, в якому всім респондентам задають одні і ті ж питання/тести, можливо, з попередньо кодованими відповідями. Якщо невелика частина такої анкети включає відкриті питання, надайте відповідні коментарі. Напівструктурований вказує, що дослідний інструмент містить переважно відкриті питання. Неструктурований вказує, що проводилися глибинні інтерв'ю.
datasetfieldtype.dataCollectionSituation.description=Опис примітних аспектів ситуації збору даних. Включає інформацію про такі фактори, як співпраця респондентів, тривалість інтерв'ю, кількість повторних дзвінків або подібне.
datasetfieldtype.actionsToMinimizeLoss.description=Підсумок дій, вжитих для мінімізації втрати даних. Включіть інформацію про дії, такі як повторні візити, наглядові перевірки, історичне зіставлення, оцінка тощо.
datasetfieldtype.controlOperations.description=Контрольні операції - методи для полегшення контролю даних, виконані головним дослідником або архівом даних.
datasetfieldtype.weighting.description=Використання процедур вибірки може зробити необхідним застосування ваг для отримання точних статистичних результатів. Описує критерії використання ваг в аналізі колекції. Якщо була розроблена формула зважування або коефіцієнт, надається формула, визначаються її елементи і вказується, як формула була застосована до даних.
datasetfieldtype.cleaningOperations.description=Методи, використані для очищення збору даних, такі як перевірка послідовності, перевірка диких кодів або інше.
datasetfieldtype.datasetLevelErrorNotes.description=Елемент примітки, використаний для будь-якої інформації, що анотує або роз'яснює методологію та обробку дослідження.
datasetfieldtype.responseRate.description=Відсоток членів вибірки, які надали інформацію.
datasetfieldtype.samplingErrorEstimates.description=Міра того, наскільки точно можна оцінити значення популяції з даної вибірки.
datasetfieldtype.otherDataAppraisal.description=Інші питання, що стосуються оцінки даних. Опишіть такі питання, як дисперсія відповідей, рівень невідповідей і тестування на упередженість, упередженість інтерв'юера та відповідей, рівні довіри, упередженість питань або подібне.
datasetfieldtype.socialScienceNotes.description=Загальні примітки про цей набір даних.
datasetfieldtype.socialScienceNotesType.description=Тип примітки.
datasetfieldtype.socialScienceNotesSubject.description=Тема примітки.
datasetfieldtype.socialScienceNotesText.description=Текст для цієї примітки.
