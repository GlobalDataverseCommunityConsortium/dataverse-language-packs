datasetfieldtype.geographicCoverage.description=Інформація про географічне покриття даних. Включає загальний географічний обсяг даних.
datasetfieldtype.country.description=Країна або нація, про яку йдеться в наборі даних.
datasetfieldtype.state.description=Штат або провінція, про яку йдеться в наборі даних. Використовуйте GeoNames для правильного написання та уникайте скорочень.
datasetfieldtype.city.description=Назва міста, про яке йдеться в наборі даних. Використовуйте GeoNames для правильного написання та уникайте скорочень.
datasetfieldtype.otherGeographicCoverage.description=Інша інформація про географічне покриття даних.
datasetfieldtype.geographicUnit.description=Найнижчий рівень географічної агрегації, охоплений набором даних, напр., село, округ, регіон.
datasetfieldtype.geographicBoundingBox.description=Основний геометричний опис для будь-якого набору даних, що моделює географію, є географічний обмежувальний прямокутник. Він описує мінімальний прямокутник, визначений західною та східною довготою та північною та південною широтою, який включає найбільшу географічну протяжність географічного покриття набору даних. Цей елемент використовується при першому проході пошуку на основі координат. Включення цього елемента до кодової книги рекомендується, але є обов'язковим, якщо включений обмежувальний прямокутник.
datasetfieldtype.westLongitude.description=Найзахідніша координата, що обмежує географічну протяжність набору даних. Допустимий діапазон значень, виражений у десяткових градусах, становить -180.0 <= Значення західної обмежувальної довготи <= 180.0.
datasetfieldtype.eastLongitude.description=Найсхідніша координата, що обмежує географічну протяжність набору даних. Допустимий діапазон значень, виражений у десяткових градусах, становить -180.0 <= Значення східної обмежувальної довготи <= 180.0.
datasetfieldtype.northLatitude.description=Найпівнічніша координата, що обмежує географічну протяжність набору даних. Допустимий діапазон значень, виражений у десяткових градусах, становить -90.0 <= Значення північної обмежувальної широти <= 90.0.
datasetfieldtype.southLatitude.description=Найпівденніша координата, що обмежує географічну протяжність набору даних. Допустимий діапазон значень, виражений у десяткових градусах, становить -90.0 <= Значення південної обмежувальної широти <= 90.0.
