datasetfieldtype.ARCS1.title=1) Чи були будь-які з цих наборів даних а) придбані, б) отримані через ліцензовані бази даних, або в) надані організацією згідно з угодою про нерозголошення або іншою угодою?
datasetfieldtype.ARCS2.title=2) Якщо ви відповіли Так на запитання 1, чи ви переконалися, що обмін даними не порушує умови угоди? Якщо ви відповіли Ні на запитання 1, будь ласка, введіть N/A тут.
datasetfieldtype.ARCS3.title=3) Чи містить будь-який з цих наборів даних дані на індивідуальному рівні (зібрані або існуючі в наборі даних), які можуть підпадати під розгляд щодо захисту прав людини в США чи на міжнародному рівні?
datasetfieldtype.ARCS4.title=4) Якщо ви відповіли Так на запитання 3, чи були ці набори даних повністю знеособлені, або обмін був схвалений вашою інституційною наглядовою радою (IRB)? Якщо ви відповіли Ні на запитання 3, будь ласка, введіть N/A тут.
datasetfieldtype.ARCS5.title=5) Чи містять ці набори даних конфіденційну або особисто ідентифіковану приватну інформацію? (Політика безпеки даних Гарвардського університету для досліджень {www.security.harvard.edu/research-data-security-policy} може застосовуватися, оскільки цей Dataverse розміщений Гарвардським Університетом.)
