datasetfieldtype.studyAssayOtherOrganism.description=Якщо в полі «Організм» обрано «Інше», перерахунок інших організмів, використаних у цьому наборі даних. Рекомендуються терміни з NCBI Taxonomy.
datasetfieldtype.studyAssayMeasurementType.description=Термін, що характеризує кінцеву точку або те, що вимірюється (наприклад, профілювання експресії генів; ідентифікація білків).
datasetfieldtype.studyAssayOtherMeasurmentType.description=Якщо в полі «Тип вимірювання» обрано «Інше», перерахунок інших типів вимірювань, що використовувалися. Рекомендуються терміни з NCBO BioPortal.
datasetfieldtype.studyAssayTechnologyType.description=Термін, що описує технологію, використану для виконання вимірювання (наприклад, DNA microarray; mass spectrometry).
datasetfieldtype.studyAssayOtherTechnologyType.description=Якщо в полі «Тип технології» обрано «Інше», перерахунок інших типів технологій, що використовувалися в цьому наборі даних.
datasetfieldtype.studyAssayPlatform.description=Виробник і назва платформи технології, використаної в аналізі (наприклад, Bruker AVANCE).
datasetfieldtype.studyAssayOtherPlatform.description=Якщо в полі «Платформа технології» обрано «Інше», перерахунок інших платформ, що використовувалися в цьому наборі даних.
