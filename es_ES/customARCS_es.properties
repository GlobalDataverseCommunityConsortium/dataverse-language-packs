datasetfieldtype.ARCS1.title=1) ¿Fueron algunos de estos datasets a) comprados, b) obtenidos de bases de datos con licencia, o c) proporcionados por una organización provided by an organization en virtud de un acuerdo de confidencialidad u otro acuerdo?
datasetfieldtype.ARCS2.title=2) Si respondió Sí a Q1, ¿se ha asegurado de que compartir los datos no contraviene los teŕiminos del acuerdo? Si respondío No a Q1, introduzca aquí N/A.
datasetfieldtype.ARCS3.title=3) ¿Alguno de esos datasets incluyen datos sobre individuos (sean recolectados o pre-existentes en el dataset) que puedan estar sujetas a la normativa estadounidense o internacional sobre seres humanos?
datasetfieldtype.ARCS4.title=4) Si respondió Sí a		 Q3, are these data sets totally de-identified or was sharing approved by your institutional review board ( IRB)? If you responded No to Q3 please enter N/A here.
datasetfieldtype.ARCS5.title=5) ¿Estos datasets contiene información sensible o que permita identificar información personal de identificación? (La política de seguridad de datos de investigación en Harvard {www.security.harvard.edu/research-data-security-policy} puede aplicarse porque este dataverse está depositado en la Universidad de Harvard.)
