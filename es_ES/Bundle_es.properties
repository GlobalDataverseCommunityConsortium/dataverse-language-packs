harvestserver.noSets.how.tip2=Una vez se habilita el servicio, puede definir las colecciones de datasets locales que estarán disponibles para los recolectores remotos como <i>Sets OAI</i>. Los Sets se definen como queries (por ejemplo: 'authorName:king' o 'parentId:1234' para seleccionar todos los datasets que pertenecen al dataverse 1234 o 'dsPersistentId:"doi:1234"' para seleccionar todos los datasets con el identificador persistente de autoridad especificado). Consulte la sección de búsqueda del API de la guía del usuario de Dataverse para ampliar la información sobre las queries de búsqueda.
