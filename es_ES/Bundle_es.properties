harvestserver.noSets.why.reason1=La recolección es un proceso de intercambio de metadatos con otros repositorios. Como <b><i>servidor</i></b> de recolección, su dataverse puede hacer que los metadatos locales de algunos datasets estén disponibles para ser recolectados de forma remota. Podrán ser recolectados por otras instancias de Dataverse o cualquier cliente que conozca el protocolo de recolección OAI-web.
harvestserver.noSets.why.reason2=Solo los datasets publicados sin restricciones en su dataverse pueden ser recolectados. Los clientes remotos normalmente mantienen sincronizados sus registros mediante recolecciones incrementales periódicas diarias o semanales, de forma que se minimice la carga de su servidor. Tenga en cuenta que solo se recolectarán los metadatos. Los recolectores remotos no intentarán descargarse los ficheros de datos normalmente.
