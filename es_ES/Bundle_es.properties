#harvestclients.xhtml
harvestclients.title=Administrar la recolección de clientes
harvestclients.toptip=La recolección pude ser programada para ejecutarse bajo demanda o en un momento determinado. La recolección se puede iniciar aquí o mediante el API REST.
harvestclients.noClients.label=No hay clientes configurados.
harvestclients.noClients.why.header=¿Qué se está recolectando?
harvestclients.noClients.why.reason1=La recolección es un proceso de intercambio de metadatos con otros repositorios. Como <b><i>cliente</i></b> en la recolección, su dataverse recoge registros de metadatos provenientes de fuentes remotas, que pueden ser otras instancias de Dataverse u otros servidores que soporten OAI-PMH, el protocolo estándar para la recolección de metadatos.
harvestclients.noClients.why.reason2=Los registros de metadatos recolectados pueden ser encontrados por los usuarios. Seleccionar un dataset recolectado en los resultados de la búsqueda, lleva al usuario al repositorio original. Los datasets recolectados no pueden ser editados en su instalación de Dataverse.
harvestclients.noClients.how.header=Como usar la recolección
harvestclients.noClients.how.tip1=Para recolectar metadatos, se crea y configura un <i>Recolector cliente</i> para cada repositorio remoto. Tenga en cuenta que al crear un cliente, necesitará seleccionar un dataverse local para albergar los datasets recolectados.
harvestclients.noClients.how.tip2=Los registros recolectados pueden mantenerse sincronizados con el servidor original programando actualizaciones incrementales (diarias o semanales por ejemplo). De forma alternativa, la recolección se puede realizar bajo demanda desde esta página o usando el API REST.
harvestclients.noClients.getStarted=Para comenzar, pulse el botón Añadir Cliente. Si quiere más información sobre como recolectar, revise la sección sobre <a href="{0}/{1}/admin/dashboard.html#harvesting" title="Guía de usuario de Dataverse - Recolección" target="_blank">Recolección</a> el panel de control de la Guía de administración.
