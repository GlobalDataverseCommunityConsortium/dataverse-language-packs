datasetfieldtype.geographicCoverage.description=Información sobre la cobertura geográfica de los datos. Incluye el ámbito geográfico total de los datos.
datasetfieldtype.country.description=País o nación al que hace referencia el dataset.
datasetfieldtype.state.description=Estado o provincia al que hace referencia el dataset. Evite abreviaciones y use GeoNames para conocer la nomenclatura correcta.
datasetfieldtype.city.description=Nombre de la ciudad a la que hace referencia el dataset. Evite abreviaciones y use GeoNames para conocer la nomenclatura correcta.
datasetfieldtype.otherGeographicCoverage.description=Otra información sobre la cobertura geográfica.
datasetfieldtype.geographicUnit.description=Nivel inferior de agregación geográfica cubierta por el dataset. Ej: pueblo, ciudad, región.
datasetfieldtype.geographicBoundingBox.description=El rectángulo envolvente geográfico es la descripción geométrica fundamental sobre cualquier dataset que representa a una zona geográfica. Describe el mínimo recuadro definido por sus longitudes este y oeste y por sus latitudes norte y sur, que incluye la mayor parte de la extensión geográfica cubierta por el dataset. Este elemento se usa como primer paso en una búsqueda basada en coordenadas. Se recomienda la inclusión de este elemento en un manual de códigos, pero es obligatoria si se incluye un polígono envolvente geográfico.
datasetfieldtype.westLongitude.description=Coordenada más occidental de la extensión geográfica del dataset. Un rango válido para estos valores expresado en grados decimales puede ser -180.0 <= valor de límite de la longitud oeste <= 180.0
datasetfieldtype.eastLongitude.description=Coordenada más oriental de la extensión geográfica del dataset. Un rango válido para estos valores expresado en grados decimales puede ser -180.0 <= valor de límite de la longitud este <= 180.0
datasetfieldtype.northLatitude.description=Coordenada más septentrional de la extensión geográfica del dataset. Un rango válido para estos valores expresado en grados decimales puede ser -90.0 <= valor de límite de la latitud norte <= 90.0
datasetfieldtype.southLatitude.description=Coordenada más meridional de la extensión geográfica del dataset. Un rango válido para estos valores expresado en grados decimales puede ser -90.0 <= valor de límite de la latitud sur <= 90.0
