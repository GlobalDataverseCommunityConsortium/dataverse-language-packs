datasetfieldtype.unitOfAnalysis.description=Unidad básica de análisis o de observación que describe este dataset, como pueden ser individuos, familias/hogares, grupos, instituciones/organizaciones, unidades administrativas y otros. Si necesita información sobre el vocabulario controlado DDI, puede visitar la web http://www.ddialliance.org/controlled-vocabularies (en inglés).
datasetfieldtype.universe.description=Descripción de la población cubierta por los datos del fichero; el grupo de población u otros elementos que son el objeto del estudio y a los cuales dicho estudio se refiere. Edad, nacionalidad y residencia normalmente ayudan a delimitar el universo dado, pero pueden usarse también otros factores, como límites de edad, sexo, estado civil, raza, grupo étnico, renta, condición de veterano de guerra, antecedentes penales, entre otros. El universo puede estar formado por elementos distintos a personas como unidades habitacionales, causas judiciales, muertes o países entre otros. En general, con la descripción del universo, deberá poder decirse si un individuo particular o elemento es parte de la población que se está estudiando. También se le llama universo de interés, población de interés y población objetivo.
datasetfieldtype.timeMethod.description=El método temporal o la dimensión temporal de la recolección de datos, como por panel, estudio transversal, tendencias, series temporales y otros.
datasetfieldtype.dataCollector.description=Individuo, agencia u organización responsable de administrar el cuestionario o entrevista y reunir los datos.
datasetfieldtype.collectorTraining.description=Tipo de formación ofrecida al recolector de datos
datasetfieldtype.frequencyOfDataCollection.description=Si los datos se recolectan en distintos momentos, indicar la frecuencia de recolección. Puede ser mensual, cuatrimestral u otra.
datasetfieldtype.samplingProcedure.description=Tipo de muestra y diseño de la muestra usado para que la selección de los encuestados represente a la población. Se puede hacer referencia al tamaño de muestra y a la fracción de muestreo.
datasetfieldtype.targetSampleSize.description=Información específica relativa al tamaño de la muestra objetivo, tamaño de muestra real y la fórmula para determinarla.
datasetfieldtype.targetSampleActualSize.description=Tamaño de muestra real
datasetfieldtype.targetSampleSizeFormula.description=Fórmula usada para definir el tamaño de muestra objetivo.
datasetfieldtype.deviationsFromSampleDesign.description=Mostrar la correspondencia, así como las discrepancias entre las unidades de muestreo (obtenidas) y las estadísticas disponibles para la población (edad, proporción de sexos, estado civil, etc.) de forma global.
datasetfieldtype.collectionMode.description=Método usado para recolectar los datos; características de la instrumentación (ej: entrevista telefónica, cuestionario por e-mail, u otro).
datasetfieldtype.researchInstrument.description=Tipo de instrumento usado para la recolección de datos. "Estructurado" indica un instrumento en el cual a todos los entrevistados les hacen las mismas preguntas/tests, quizá con las mismas respuestas precodificadas. Si una pequeña parte del cuestionario incluye preguntas abiertas, provea los comentarios apropiados. "Semi-estructurado" indica que los instrumentos de investigación incluyen muchas preguntas abiertas. "Sin estructura" indica que se realizaron entrevistas minuciosas.
datasetfieldtype.dataCollectionSituation.description=Descripción de aspectos considerables de la situación de la recolección de datos, incluyendo información de temas como la cooperación de los encuestados, duración de las entrevistas, número de llamadas respondidas, y datos similares.
datasetfieldtype.actionsToMinimizeLoss.description=Resumen de las acciones tomadas para minimizar la pérdida de datos, incluyendo la información de acciones como seguimiento de visitas, chequeos de supervisión, casación de datos históricos, estimaciones y otras.
datasetfieldtype.controlOperations.description=Métodos usados para facilitar el control de datos realizados por el investigador primario o por el archivo de datos.
datasetfieldtype.weighting.description=El uso de procedimientos de muestreo puede hacer necesario aplicar pesos para producir resultados estadísticos fiables. Describa el criterio para usar pesos en el análisis de una colección. Si se ha desarrollado una fórmula de pesos o un coeficiente, se indica la fórmula, están definidos sus elementos y se indica como se aplica la fórmula a los datos.
datasetfieldtype.cleaningOperations.description=Métodos usados para limpiar la colección de datos, como pruebas de consistencia, verificación de código no válido y otros.
datasetfieldtype.datasetLevelErrorNotes.description=Observaciones utilizadas para apuntar información o clarificar la metodología y el procesamiento del estudio.
datasetfieldtype.responseRate.description=Porcentaje de los miembros de la muestra que han proporcionado información.
datasetfieldtype.samplingErrorEstimates.description=Medida de la precisión de la estimación de la población para una muestra en concreto.
datasetfieldtype.otherDataAppraisal.description=Otras cuestiones relacionadas con la evaluación de los datos. Describa cuestiones como la varianza de las respuestas, tasa de encuestas no respondidas, pruebas de sesgos y otras similares.
