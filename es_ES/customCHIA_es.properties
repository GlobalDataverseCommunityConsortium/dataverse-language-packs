datasetfieldtype.sourceCHIA.description=Fuente - Describe la fuente de los datos. ¿de la oficina de trabajo y estadísticas? ¿datos de Naciones Unidas?
datasetfieldtype.datesAdditionalInformationCHIA.description=Fechas - Información adicional - Inidique cualquier otra información acerca de fechas o periodos de tiempo en el dataset, incluyendo intervalos (anual, década, siglo, etc.) También apunte la(s) columna(s) en el dataset dónde se puede encontrar las fechas y otra información temporal.
datasetfieldtype.variablesCHIA.description=Variables - Defina las variables en este dataset. Inidique la columna del dataset dónde se puede encontrar la información de la variable.
datasetfieldtype.classificationSchemaCHIA.description=Esquema de clasificación - Si hay un esquema de clasificación en este dataset, descríbalo. Por ejemplo, M_20_24 debería leerse como Hombres, edad 20-24.
datasetfieldtype.provenanceCHIA.description=Procedencia - La procedencia de los datasets es el registro de la propiedad y se usará com una guida para la autenticidad y calidad de los datos. Por ejemplo, la declaración de procedencia podría ser, "Este dataset fue creado desde datos recolectados por David Ruvolo durante un viaje de recolección de dattos a España en 1992. Desde entonces, los datos solo se han alterado para migrarlos a formatos más actuales."
datasetfieldtype.rightsAvailabilityCHIA.description=Derechos/Disponibilidad - ¿Tiene los derechos para compartir estos datos?
